name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project tvbox.xcodeproj -scheme tvbox

      - name: Build iOS Release app (unsigned)
        run: >-
          xcodebuild
          -project tvbox.xcodeproj
          -scheme tvbox
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package app artifact
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/TVBox.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/TVBox-iOS-unsigned.zip"

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-iOS-${{ github.sha }}
          path: ${{ runner.temp }}/TVBox-iOS-unsigned.zip
          if-no-files-found: error
          retention-days: 14
