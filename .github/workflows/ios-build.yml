name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project tvbox.xcodeproj -scheme tvbox

      - name: Run iOS source compatibility tests
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator was found."
            exit 1
          fi
          xcodebuild test \
            -project tvbox.xcodeproj \
            -scheme tvbox-Tests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/SourceTests.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/source-tests.log"

      - name: Build iOS Release app (unsigned)
        if: ${{ !cancelled() }}
        run: >-
          xcodebuild
          -project tvbox.xcodeproj
          -scheme tvbox
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package app artifact
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/TVBox.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/TVBox-iOS-unsigned.zip"

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-iOS-${{ github.sha }}
          path: ${{ runner.temp }}/TVBox-iOS-unsigned.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload source test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-source-tests-${{ github.sha }}
          path: |
            ${{ runner.temp }}/SourceTests.xcresult
            ${{ runner.temp }}/source-tests.log
          if-no-files-found: warn
          retention-days: 14
